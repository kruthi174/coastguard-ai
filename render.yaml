# ==============================================================================
# RENDER BLUEPRINT CONFIGURATION FOR COASTGUARD AI
# Deploy full-stack FastAPI + React SPA with zero-configuration
# ==============================================================================

services:
  - type: web
    name: coastguard-ai
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: "*"
      - key: ADMIN_SECRET_KEY
        generateValue: true
      # Optional: connect managed PostgreSQL database created below
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: coastguard-postgres
      #     property: connectionString

# Optional: Managed PostgreSQL Database on Render
# Uncomment to automatically provision a dedicated PostgreSQL database
# databases:
#   - name: coastguard-postgres
#     plan: free
#     databaseName: coastguard_db
#     user: coastguard_admin
